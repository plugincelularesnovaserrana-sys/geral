<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrativo - Plugin Celulares</title>

    <link rel="apple-touch-icon" sizes="512x512" href="../assets/ICO.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../assets/ICO.png">
    <link rel="shortcut icon" sizes="512x512" href="../assets/ICO.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/FAVICON.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root{
            --bg: #0B0C10;
            --cyan: #45F3FF;
            --cyan-dim: rgba(69, 243, 255, 0.2);
            --panel-a: #1f4068;
            --panel-b: #162447;
            --border: rgba(255, 255, 255, 0.1);
            --ease: cubic-bezier(.4,0,.2,1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background:
                radial-gradient(900px 500px at 50% -10%, rgba(69, 243, 255, 0.06), transparent 60%),
                var(--bg);
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 56px 20px;
        }

        .container {
            text-align: center;
            max-width: 760px;
            width: 100%;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 44px;
            text-align: left;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand-title {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--cyan);
        }

        .brand-sub {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #7d8aa3;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.03);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            border: 1px solid var(--border);
            transition: all 0.2s var(--ease);
        }

        .back-link:hover {
            color: var(--cyan);
            border-color: var(--cyan-dim);
            background: rgba(69, 243, 255, 0.06);
        }

        .back-link svg {
            width: 13px;
            height: 13px;
        }

        .page-heading {
            text-align: left;
            margin-bottom: 32px;
        }

        .page-heading h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        .page-heading p {
            margin-top: 6px;
            font-size: 13px;
            color: #93a1b8;
            line-height: 1.5;
        }

        .modules-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
        }

        .module-item {
            background: linear-gradient(135deg, var(--panel-a), var(--panel-b));
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
        }

        details summary {
            padding: 22px 28px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.3px;
            text-transform: uppercase;
            color: var(--cyan);
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            user-select: none;
            transition: background 0.2s var(--ease);
        }

        details summary::-webkit-details-marker{ display: none; }

        details summary::after {
            content: '';
            flex: none;
            width: 8px;
            height: 8px;
            border-right: 2px solid var(--cyan);
            border-bottom: 2px solid var(--cyan);
            transform: rotate(-45deg);
            transition: transform 0.25s var(--ease);
        }

        details[open] > summary::after {
            transform: rotate(45deg);
        }

        details summary:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        details summary:focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: -2px;
        }

        .module-item > details[open] {
            border-color: var(--cyan);
            box-shadow: 0 0 0 1px var(--cyan-dim), 0 12px 30px rgba(0, 0, 0, 0.55);
        }

        .menu-content {
            padding: 22px 28px 28px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.18);
            animation: fadeIn 0.25s var(--ease);
        }

        .menu-desc {
            font-size: 12px;
            color: #93a1b8;
            line-height: 1.5;
            margin-bottom: 4px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Botões de ação unificados */
        .btn {
            width: 100%;
            padding: 17px 22px;
            color: var(--cyan);
            background: linear-gradient(135deg, var(--panel-a), var(--panel-b));
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            transition: transform 0.2s var(--ease), background 0.2s var(--ease), border-color 0.2s var(--ease), box-shadow 0.2s var(--ease), color 0.2s var(--ease);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 54px;
            line-height: 1.3;
        }

        .btn:hover {
            background: linear-gradient(135deg, #0056b3, var(--panel-a));
            border-color: var(--cyan);
            box-shadow: 0 6px 18px rgba(69, 243, 255, 0.18);
            color: #FFFFFF;
            transform: translateY(-1px);
        }

        .btn:active{
            transform: translateY(0);
        }

        .btn:focus-visible{
            outline: 2px solid var(--cyan);
            outline-offset: 2px;
        }

        .btn .arrow {
            flex: none;
            width: 8px;
            height: 8px;
            border-right: 2px solid currentColor;
            border-bottom: 2px solid currentColor;
            transform: rotate(-45deg);
            opacity: 0.7;
        }

        /* Status "em breve" para módulos ainda não implementados */
        .btn-disabled {
            width: 100%;
            padding: 17px 22px;
            color: #5b6779;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            border: 1px dashed rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 54px;
            cursor: default;
        }

        .badge-soon {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #5b6779;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 3px 8px;
            border-radius: 20px;
        }

        @media (max-width: 480px){
            body{ padding: 36px 14px; }
            .top-bar{ margin-bottom: 32px; }
            details summary{ padding: 18px 20px; font-size: 12.5px; }
            .menu-content{ padding: 18px 20px 22px; }
            .btn, .btn-disabled{ padding: 15px 18px; font-size: 11px; }
        }

        @media (prefers-reduced-motion: reduce){
            *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="top-bar">
            <div class="brand">
                <span class="brand-title">Plugin Celulares</span>
                <span class="brand-sub">Painel Administrativo</span>
            </div>

            <a href="../index.html" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"></path>
                    <path d="M12 19l-7-7 7-7"></path>
                </svg>
                Voltar ao início
            </a>
        </div>

        <div class="page-heading">
            <h1>Área Administrativa</h1>
            <p></p>
        </div>

        <div class="modules-wrapper">

            <!-- SEÇÃO: TABELAS DE PREÇO -->
            <div class="module-item">
                <details>
                    <summary>Tabelas de Preço</summary>
                    <div class="menu-content">
                        <p class="menu-desc"></p>

                        <a href="../tabelas-preco/admin.html" class="btn">
                            Atualizador de Tabelas
                            <span class="arrow"></span>
                        </a>
                    </div>
                </details>
            </div>

            <!-- SEÇÃO: EM DESENVOLVIMENTO -->
            <div class="module-item">
                <details>
                    <summary>Outros Módulos</summary>
                    <div class="menu-content">
                        <p class="menu-desc">Novos módulos administrativos serão adicionados aqui conforme forem implementados.</p>

                        <div class="btn-disabled">
                            Gerenciador de Contratos
                            <span class="badge-soon">Em breve</span>
                        </div>

                        <div class="btn-disabled">
                            Gerenciador de Usuários
                            <span class="badge-soon">Em breve</span>
                        </div>
                    </div>
                </details>
            </div>

        </div>
    </div>

</body>
</html>
